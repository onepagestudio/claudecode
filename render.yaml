services:
  - type: web
    name: line-bot
    runtime: node
    plan: free
    buildCommand: npm install
    # relay-server.js is the production entry point while this channel
    # coexists with EasyStore: it forwards the raw webhook to EasyStore
    # (for back-office visibility) and separately pushes the Claude reply.
    # Switch to `npm start` (server.js) only after fully migrating off
    # EasyStore's LINE integration.
    startCommand: npm run relay
    healthCheckPath: /
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EASYSTORE_WEBHOOK_URL
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-4-5
